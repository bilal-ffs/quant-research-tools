site_name: Quant Research Tools
site_description: Open-source quantitative finance utilities for systematic trading, portfolio analytics, risk analysis, and financial research.
site_author: Bilal
repo_url: https://github.com/bilal-ffs/quant-research-tools
repo_name: bilal-ffs/quant-research-tools

theme:
  name: readthedocs

nav:
  - Home: index.md

  - Statistics:
      - Overview: statistics.md
      - Drawdown: drawdown.md
      - Sharpe Ratio: sharpe.md

  - Portfolio:
      - Overview: portfolio.md

  - Risk: risk.md
  - Backtest: backtest.md
  - Reports: reports.md

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js